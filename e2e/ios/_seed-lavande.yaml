# Reusable subflow: seeds the single plant check 08 needs — "Lavande", no
# zone, with its pruning month set to the current month, so "Ce mois-ci au
# jardin" always derives a pruning task from it regardless of when this runs.
# ${MONTH_NAME} is passed by scripts/e2e-ios.sh (see its lib/months.js
# MONTH_NAMES mapping) — never hard-code a month here.
#
# Ends on Lavande's own detail screen (no tab bar) — saving a plant replaces
# the stack entry with its detail screen.
#
# Run after `clearState` + `_open-app.yaml`. Not listed in config.yaml's
# `flows:`, so `maestro test e2e/ios/` never runs this standalone — only via
# `runFlow` from a numbered check.
appId: host.exp.Exponent
---
- tapOn: "Bibliothèque, tab.*"
- tapOn: 'Ajouter une plante'
- extendedWaitUntil:
    visible: 'Nom de la plante'
    timeout: 15000
# Ticket 069: the name field is a labelled components/form/Field, so its own
# label text ("Nom de la plante") sits right above the input and would also
# match a plain tapOn — target the placeholder instead, which only the
# TextInput itself carries, to land on the actual field.
- tapOn: "ex. Rosier grimpant"
- inputText: "Lavande"
- tapOn: "Nouvelle plante"
# Since 069 the sticky save button shortens the scroll view, so the
# "Plus de détails" toggle starts below it: scroll it into view first.
- scrollUntilVisible:
    element:
      text: "Plus de détails"
    direction: DOWN
    centerElement: true
- tapOn: "Plus de détails"
# "Mois de taille" (Entretien section)'s MonthRangePicker lays out all
# twelve months in one row -- no nested horizontal scroll needed any more,
# just scroll the section into view and tap the month cell by its
# accessibilityLabel (the full French month name).
- scrollUntilVisible:
    element:
      text: "Mois de taille"
    direction: DOWN
- tapOn: "${MONTH_NAME}"
- scrollUntilVisible:
    element:
      text: "Enregistrer"
    direction: DOWN
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml
