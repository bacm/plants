# Check 4: a bloom range missing its end month, and an invalid calendar date,
# are both refused with an inline message and block save (lib/validation.js
# checkMonthPair / parseISODate).
#
# Ticket 069 restyled the bloom/harvest months from text fields into a
# MonthRangePicker (a 1-12 tap grid), which makes entering an out-of-range
# month like "13" impossible through the UI any more -- there is no longer a
# way to trigger parseMonth's own range check from the form. This flow now
# exercises the other month-related validation path that is still reachable:
# picking only a start month and leaving the end unset.
appId: host.exp.Exponent
---
- clearState
- runFlow: _open-app.yaml

# This check only exercises validation on a brand-new plant, so no seeded
# data is needed — go straight from the dashboard (which already has the
# shared tab bar) to Bibliothèque.
- tapOn: "Bibliothèque, tab.*"
- tapOn: 'Ajouter une plante'
- extendedWaitUntil:
    visible: 'Nom de la plante'
    timeout: 15000
# Ticket 069: the name field is a labelled components/form/Field, so its own
# label text ("Nom de la plante") sits right above the input and would also
# match a plain tapOn — target the placeholder instead, which only the
# TextInput itself carries, to land on the actual field.
- tapOn: "ex. Rosier grimpant"
- inputText: "Test Validation"
- tapOn: "Nouvelle plante"
# Since 069 the sticky save button shortens the scroll view, so the
# "Plus de détails" toggle starts below it: scroll it into view first.
- scrollUntilVisible:
    element:
      text: "Plus de détails"
    direction: DOWN
    centerElement: true
- tapOn: "Plus de détails"
- scrollUntilVisible:
    element:
      text: "Période"
    direction: DOWN
- tapOn: "Mai"
- scrollUntilVisible:
    element:
      text: "Enregistrer"
    direction: DOWN
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml
# The iOS accessibility tree (unlike React Native's own view tree) only
# exposes elements actually on screen, and we're still scrolled down to
# "Enregistrer" at this point — scroll back up to where the inline error
# renders (right under the Période picker) before asserting on it.
- scrollUntilVisible:
    element:
      text: "Indiquez aussi le mois de fin"
    direction: UP
- assertVisible: "Indiquez aussi le mois de fin"

# Tapping "Mai" again closes the range on itself (a single-month 5-5 range),
# which satisfies checkMonthPair and clears the error.
- tapOn: "Mai"
- scrollUntilVisible:
    element:
      text: "AAAA-MM-JJ"
    direction: DOWN
- tapOn: "AAAA-MM-JJ"
- inputText: "2026-02-30"
# This field's keyboard has no "Done" key either; tap the label instead.
- tapOn: "Date d'ajout"
- scrollUntilVisible:
    element:
      text: "Enregistrer"
    direction: DOWN
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml
# Same off-screen-elements-aren't-in-the-tree issue as above.
- scrollUntilVisible:
    element:
      text: "Date au format AAAA-MM-JJ"
    direction: UP
- assertVisible: "Date au format AAAA-MM-JJ"
