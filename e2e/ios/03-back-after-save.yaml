# Check 3: after saving an edit and a care log from a plant reached via
# Bibliothèque, "Retour" goes back to the Bibliothèque list (no navigation
# desync, unlike the web router.back() bug from ticket 034).
appId: host.exp.Exponent
---
- clearState
- runFlow: _open-app.yaml
- runFlow: _seed-minimal.yaml

# _seed-minimal.yaml ends on Rosier rouge's own detail screen (no tab bar);
# go back to Bibliothèque (which has the shared tab bar) and back in, so this
# check exercises the "reached via Bibliothèque" navigation it's about. It's
# the only plant, so no search is needed to find it again.
- tapOn: "Retour"
- tapOn: "Bibliothèque, tab.*"
- runFlow: _dismiss-dev-menu.yaml
- extendedWaitUntil:
    visible: ".*Rosier rouge.*"
    timeout: 10000
- tapOn: ".*Rosier rouge.*"
- scrollUntilVisible:
    element:
      text: "Modifier la fiche"
    direction: DOWN
- tapOn: "Modifier la fiche"
- scrollUntilVisible:
    element:
      text: "Enregistrer"
    direction: DOWN
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml

# Since 067 the care log opens from the sticky "Enregistrer un soin" button,
# shown on every tab of the detail screen (the old "+ Log" link is gone).
- tapOn: "Enregistrer un soin"
- tapOn: "Taillé"
# The log screen's own title is also "Enregistrer un soin"; the exact
# "Enregistrer" only matches its sticky save button.
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml

# Back on the detail screen, unscrolled: the hero's round "Retour" button is
# on screen.
- tapOn: "Retour"
- assertVisible: ".*Rechercher.*"
