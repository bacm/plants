# Check 1: editing a plant to set "Date d'ajout", saving, then clearing that
# field and saving again keeps the originally-set date rather than blanking
# it or resetting to today. This protects lib/plantFields.js's `case 'date'`
# behavior: a blank createdAt maps to `undefined`, which pickPlantUpdates
# omits from the SQL SET clause entirely, so the column is left untouched.
appId: host.exp.Exponent
---
- clearState
- runFlow: _open-app.yaml
- runFlow: _seed-minimal.yaml

# _seed-minimal.yaml ends on Rosier rouge's own detail screen — it's the
# only plant, so no navigation/search is needed to reach it.
- scrollUntilVisible:
    element:
      text: "Modifier la fiche"
    direction: DOWN
- tapOn: "Modifier la fiche"
- scrollUntilVisible:
    element:
      text: "Date d'ajout"
    direction: DOWN
- tapOn:
    below: "Date d'ajout"
- eraseText: 12
- inputText: "2024-03-15"
# This field's keyboard has no "Done" key either; tap the label instead.
- tapOn: "Date d'ajout"
- scrollUntilVisible:
    element:
      text: "Enregistrer"
    direction: DOWN
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml

- scrollUntilVisible:
    element:
      text: "Modifier la fiche"
    direction: DOWN
- tapOn: "Modifier la fiche"
- scrollUntilVisible:
    element:
      text: "Date d'ajout"
    direction: DOWN
- assertVisible: "2024-03-15"

- tapOn:
    below: "Date d'ajout"
- eraseText: 12
- tapOn: "Date d'ajout"
- scrollUntilVisible:
    element:
      text: "Enregistrer"
    direction: DOWN
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml

- scrollUntilVisible:
    element:
      text: "Modifier la fiche"
    direction: DOWN
- tapOn: "Modifier la fiche"
- scrollUntilVisible:
    element:
      text: "Date d'ajout"
    direction: DOWN
- assertVisible: "2024-03-15"
