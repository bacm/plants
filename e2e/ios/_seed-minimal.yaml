# Reusable subflow: seeds the smallest garden that satisfies the numbered
# checks that don't care about zone/bloom variety — one zone ("Massif sud")
# and one plant ("Rosier rouge", assigned to that zone, bloom 5-7). Creating
# a plant also auto-creates its watering reminder (see app/plant/new.js), so
# this single plant covers checks that just need "a plant with a reminder"
# too.
#
# Ends on Rosier rouge's own detail screen (no tab bar) — saving a plant
# replaces the stack entry with its detail screen.
#
# Run after `clearState` + `_open-app.yaml`. Not listed in config.yaml's
# `flows:`, so `maestro test e2e/ios/` never runs this standalone — only via
# `runFlow` from a numbered check.
appId: host.exp.Exponent
---
# Ticket 068: tap by testID, not the button's "Nouvelle zone" text -- see
# _seed-garden.yaml's comment on the same button.
- tapOn: "Zones, tab.*"
- tapOn:
    id: "zone-list-new-button"
- tapOn: "Nom de la zone"
- inputText: "Massif sud"
- hideKeyboard
- tapOn: "Créer la zone"

- tapOn: "Bibliothèque, tab.*"
- tapOn: 'Ajouter une plante'
- extendedWaitUntil:
    visible: 'Nom de la plante'
    timeout: 15000
# Ticket 069: the name field is a labelled components/form/Field, so its own
# label text ("Nom de la plante") sits right above the input and would also
# match a plain tapOn — target the placeholder instead, which only the
# TextInput itself carries, to land on the actual field.
- tapOn: "ex. Rosier grimpant"
- inputText: "Rosier rouge"
- hideKeyboard
- tapOn: "Massif sud"
- tapOn: "Plus de détails"
# Bloom months are now MonthRangePicker taps (no text entry) — tap the start
# and end month cells by their accessibilityLabel (the full French month
# name). "Période" is the bloom picker's own label, scrolled to first so
# only its row is on screen when "Mai"/"Juillet" are tapped.
- scrollUntilVisible:
    element:
      text: "Période"
    direction: DOWN
- tapOn: "Mai"
- tapOn: "Juillet"
- scrollUntilVisible:
    element:
      text: "Enregistrer"
    direction: DOWN
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml
