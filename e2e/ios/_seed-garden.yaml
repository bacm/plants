# Reusable subflow: seeds the demo garden from /tmp/ux-ios/report.md — three
# zones and five plants — so every check flow starts from the same known
# state. Run after `clearState` + `_open-app.yaml`.
#
# Zones: Massif sud, Potager, Ombre nord.
# Plants: Rosier rouge (Massif sud, bloom 5-7, rouge), Hellébore (Ombre nord,
# bloom 12-2, wraps the year), Lavande (Potager, bloom 6-8, violette, pruning
# month = Sep), Framboisier (Potager, harvest 7-9), Mystère (name only, no
# zone). Plants are always added from the Bibliothèque list's "Ajouter une
# plante" button (reached via the tab once, then via "Retour" — saving a
# plant replaces the stack entry with its detail screen, which has no tab
# bar) — a zone's own detail screen only offers that button while the zone
# has zero plants (see report.md's "UX / layout observations").
#
# Not listed in config.yaml's `flows:`, so `maestro test e2e/ios/` never
# runs this standalone — only via `runFlow` from a numbered check.
appId: host.exp.Exponent
---

# --- Zones ---
# Ticket 068: the zones list's dashed "add zone" button now reads "Nouvelle
# zone" — the same text as the zone form it opens (components/ZoneForm.js's
# heroTitle). Since this flow creates three zones in a row, tapping on that
# text could match either the button or a not-yet-unmounted previous form
# screen; tap by testID (app/(tabs)/zones/index.js's
# "zone-list-new-button") instead, which is unambiguous regardless of stack
# state.
- tapOn: "Zones, tab.*"
- tapOn:
    id: "zone-list-new-button"
- tapOn: "Nom de la zone"
- inputText: "Massif sud"
- hideKeyboard
- tapOn: "Créer la zone"

- tapOn:
    id: "zone-list-new-button"
- tapOn: "Nom de la zone"
- inputText: "Potager"
- hideKeyboard
- tapOn: "Créer la zone"

- tapOn:
    id: "zone-list-new-button"
- tapOn: "Nom de la zone"
- inputText: "Ombre nord"
- hideKeyboard
- tapOn: "Créer la zone"

# --- Rosier rouge: Massif sud, bloom 5-7, rouge ---
- tapOn: "Bibliothèque, tab.*"
- tapOn: 'Ajouter une plante'
- extendedWaitUntil:
    visible: 'Nom de la plante'
    timeout: 15000
# Ticket 069: the name field is a labelled components/form/Field, so its own
# label text ("Nom de la plante") sits right above the input and would also
# match a plain tapOn — target the placeholder instead, which only the
# TextInput itself carries, to land on the actual field.
- tapOn: "ex. Rosier grimpant"
- inputText: "Rosier rouge"
- hideKeyboard
- tapOn: "Massif sud"
- tapOn: "Plus de détails"
- scrollUntilVisible:
    element:
      text: "ex. rose, blanc"
    direction: DOWN
- tapOn: "ex. rose, blanc"
- inputText: "rouge"
- hideKeyboard
# Ticket 069: bloom months are now MonthRangePicker taps (no text entry) —
# tap the start month's cell, then the end month's, both by their
# accessibilityLabel (the full French month name). "Période" is the bloom
# picker's own label, scrolled to first so only its row (not the pruning or
# harvest pickers further down) is on screen when "Mai"/"Juillet" are tapped.
- scrollUntilVisible:
    element:
      text: "Période"
    direction: DOWN
- tapOn: "Mai"
- tapOn: "Juillet"
- scrollUntilVisible:
    element:
      text: "Enregistrer"
    direction: DOWN
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml

# --- Hellébore: Ombre nord, bloom 12-2 (wraps the year) ---
- tapOn: "Retour"
- tapOn: 'Ajouter une plante'
- extendedWaitUntil:
    visible: 'Nom de la plante'
    timeout: 15000
- tapOn: "ex. Rosier grimpant"
- inputText: "Hellébore"
- hideKeyboard
- tapOn: "Ombre nord"
- tapOn: "Plus de détails"
- scrollUntilVisible:
    element:
      text: "Période"
    direction: DOWN
- tapOn: "Décembre"
- tapOn: "Février"
- scrollUntilVisible:
    element:
      text: "Enregistrer"
    direction: DOWN
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml

# --- Lavande: Potager, bloom 6-8, violette, pruning month = Sep ---
- tapOn: "Retour"
- tapOn: 'Ajouter une plante'
- extendedWaitUntil:
    visible: 'Nom de la plante'
    timeout: 15000
- tapOn: "ex. Rosier grimpant"
- inputText: "Lavande"
- hideKeyboard
- tapOn: "Potager"
- tapOn: "Plus de détails"
- scrollUntilVisible:
    element:
      text: "ex. rose, blanc"
    direction: DOWN
- tapOn: "ex. rose, blanc"
- inputText: "violette"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Période"
    direction: DOWN
- tapOn: "Juin"
- tapOn: "Août"
# "Mois de taille" (Entretien section) is its own MonthRangePicker further
# down, all twelve months laid out in one row (no nested horizontal scroll
# needed any more) — scroll it into view and tap September directly.
- scrollUntilVisible:
    element:
      text: "Mois de taille"
    direction: DOWN
- tapOn: "Septembre"
- scrollUntilVisible:
    element:
      text: "Enregistrer"
    direction: DOWN
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml

# --- Framboisier: Potager, harvest 7-9 ---
- tapOn: "Retour"
- tapOn: 'Ajouter une plante'
- extendedWaitUntil:
    visible: 'Nom de la plante'
    timeout: 15000
- tapOn: "ex. Rosier grimpant"
- inputText: "Framboisier"
- hideKeyboard
- tapOn: "Potager"
- tapOn: "Plus de détails"
- scrollUntilVisible:
    element:
      text: "Période de récolte"
    direction: DOWN
- tapOn: "Juillet"
- tapOn: "Septembre"
- scrollUntilVisible:
    element:
      text: "Enregistrer"
    direction: DOWN
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml

# --- Mystère: name only, no zone ---
- tapOn: "Retour"
- tapOn: 'Ajouter une plante'
- extendedWaitUntil:
    visible: 'Nom de la plante'
    timeout: 15000
- tapOn: "ex. Rosier grimpant"
- inputText: "Mystère"
- hideKeyboard
- tapOn: "Enregistrer"
- runFlow: _dismiss-dev-menu.yaml
