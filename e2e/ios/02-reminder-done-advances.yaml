# Check 2: tapping "Fait" on a reminder advances its next due date and logs
# the care event. This is the exact scenario ticket 002 fixed (a missing
# await made markReminderDone a silent no-op) — regress it here instead of
# asserting a hardcoded date, since "today" depends on when this flow runs.
appId: host.exp.Exponent
---
- clearState
- runFlow: _open-app.yaml
- runFlow: _seed-minimal.yaml

# _seed-minimal.yaml ends on Rosier rouge's own detail screen. Since 045 a new
# plant has no reminder: accept the watering suggestion (listed first, due
# today) on the reminders screen, then come back to the Actions tab.
- tapOn: "Actions"
- runFlow: _dismiss-dev-menu.yaml
- tapOn: "Gérer"
- tapOn: "Ajouter"
- tapOn: "Retour"
- runFlow: _dismiss-dev-menu.yaml

# Since 067 the Actions tab shows the due line from lib/reminderDue.js:
# "Aujourd’hui" for a reminder due today, "Dans N jours · <date>" after.
# Tapping "Fait" must move it a full watering interval (7 days) ahead --
# a no-op markReminderDone (ticket 002) would leave "Aujourd’hui".
- assertVisible: "Aujourd’hui"
- tapOn: "Fait"
- assertVisible: "Dans 7 jours.*"
- assertNotVisible: "Aujourd’hui"
- assertVisible: "Arrosé"
