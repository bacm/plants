# Check 2: tapping "Fait" on a reminder advances its next due date and logs
# the care event. This is the exact scenario ticket 002 fixed (a missing
# await made markReminderDone a silent no-op) — regress it here instead of
# asserting a hardcoded date, since "today" depends on when this flow runs.
appId: host.exp.Exponent
---
- clearState
- runFlow: _open-app.yaml
- runFlow: _seed-minimal.yaml

# _seed-minimal.yaml ends on Rosier rouge's own detail screen. Since 045 a new
# plant has no reminder: accept the watering suggestion (listed first) on the
# reminders screen, then come back to the Actions tab.
- tapOn: "Actions"
- runFlow: _dismiss-dev-menu.yaml
- tapOn: "Gérer"
- tapOn: "Ajouter"
- tapOn: "Retour"
- runFlow: _dismiss-dev-menu.yaml
- assertVisible: ".*Prochaine :.*"
- copyTextFrom:
    text: "Prochaine :.*"
- tapOn: "Fait"
- assertNotVisible: "${maestro.copiedText}"
- assertVisible: "Arrosé"
