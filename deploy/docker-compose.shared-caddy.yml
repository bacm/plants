# Overlay for a VPS that already runs its own Caddy on ports 80/443 (ticket
# 079): deploy/deploy.sh adds this file when SHARED_CADDY_NETWORK is set.
# This stack's Caddy is then never started, and the API joins that Caddy's
# external Docker network under an unambiguous name, `plants-api`. The shared
# Caddyfile needs a site block for the domain:
#
#   plants.example.com {
#       request_body {
#           max_size 8KB
#       }
#       reverse_proxy plants-api:8000
#   }
services:
  caddy:
    # A profile nobody enables: the service stays defined but never starts.
    profiles: ['standalone-caddy']

  api:
    networks:
      default: {}
      shared:
        aliases:
          - plants-api

networks:
  shared:
    external: true
    name: ${SHARED_CADDY_NETWORK}
