# A fixed project name, so this stack's containers and volumes never mix with
# another project's on a shared VPS (the default would be the folder name,
# "deploy").
name: plants

services:
  api:
    build: ../server
    env_file: .env
    restart: unless-stopped
    # No `ports:` — the API is reachable only through Caddy, on the compose
    # network. `expose` documents the port without publishing it on the host.
    expose:
      - '8000'
    # The synced garden (SQLite). A named volume, so redeploys keep it.
    volumes:
      - garden_data:/data
    # Inherits the Dockerfile's HEALTHCHECK.

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  garden_data:
  caddy_data:
  caddy_config:
