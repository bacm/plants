# A fixed project name, so this stack's containers and volumes never mix with
# another project's on a shared VPS (the default would be the folder name,
# "deploy").
name: plants

services:
  api:
    build: ../server
    env_file: .env
    restart: unless-stopped
    # No `ports:` — the API is reachable only through Caddy, on the compose
    # network. `expose` documents the port without publishing it on the host.
    expose:
      - '8000'
    # The synced garden (SQLite). A named volume, so redeploys keep it.
    volumes:
      - garden_data:/data
    # Inherits the Dockerfile's HEALTHCHECK.

  # The Expo web build (ticket 097): built here from the repo root, served as
  # static files. Like `api`, reachable only through Caddy.
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        # The API's public URL is baked into the bundle at build time. A URL,
        # not a secret (CLAUDE.md rule 2).
        EXPO_PUBLIC_PLANT_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    expose:
      - '8080'
    # Alpine's busybox wget; 127.0.0.1 because localhost may resolve to ::1,
    # where Caddy is not listening.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  garden_data:
  caddy_data:
  caddy_config:
